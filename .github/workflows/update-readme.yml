name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch human.md
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            -A "kyto64-readme-sync (https://github.com/kyto64/kyto64)" \
            -H "Accept: text/markdown, text/plain;q=0.9, */*;q=0.1" \
            -o /tmp/human.md \
            "https://kyto.jp/human.md"

          if head -c 200 /tmp/human.md | grep -Eiq '<!DOCTYPE html|<html|Just a moment'; then
            echo "human.md の取得結果が HTML です。README は更新しません。" >&2
            exit 1
          fi

      - name: Generate README
        run: node scripts/generate-readme.mjs /tmp/human.md README.md

      - name: Commit and push when README changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README に差分はありません"
            exit 0
          fi
          git commit -m "docs: sync README from kyto.jp/human.md"
          git push
